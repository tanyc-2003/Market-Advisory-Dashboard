[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advisory-dashboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20",
    "numpy>=1.26",
    "pandas>=2.1",
    "duckdb>=0.10",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "hmmlearn>=0.3",
    "lightgbm>=4.3",
    "shap>=0.45",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "cvxpy>=1.4",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "polygon-api-client>=1.13",
    "nasdaq-data-link>=1.0",
    "streamlit>=1.33",
    "plotly>=5.20",
    "tqdm>=4.66",
    "structlog>=24.1",
]

[project.optional-dependencies]
llm = [
    "langchain-ollama>=0.1",
    "langchain>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["src/advisory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
